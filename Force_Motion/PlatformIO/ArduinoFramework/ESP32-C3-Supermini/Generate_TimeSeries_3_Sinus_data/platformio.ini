; PlatformIO Project Configuration File
;
; ESP32-C3 Super Mini: USB native (CDC). Tanpa flag ini Serial/USB sering tidak tampil saat boot.
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_port = COM4
monitor_port = COM4

; USB CDC: Serial mengarah ke USB on-chip (bukan UART eksternal)
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
