[env:promicro_nrf52840]
platform = nordicnrf52
board = nicenano
framework = arduino
board_build.variants_dir = boards
board_build.variant = nicenano

upload_port = COM12
monitor_port = COM12
monitor_speed = 115200
monitor_echo = yes

; TinyUSB USB-CDC harus di-link sebagai object, bukan archive
lib_archive = no
build_flags =
    -DUSE_TINYUSB
    -include time.h

lib_deps =
    bitbank2/BitBang_I2C
